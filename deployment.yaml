apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
matchLabels:
  app: myapp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: myapp-image:latest
        ports:
        - containerPort: 5000